# Requires External Secrets Operator with external-secrets.io/v1 support.
# DEV example. Configure each environment independently; do not share robots/tokens.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-sync
  namespace: build-dev
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: build-dev
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: build-dev
          serviceAccountRef:
            name: vault-sync
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: build-api
  namespace: build-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target: {name: build-api}
  data:
    - secretKey: token
      remoteRef: {key: delivery/dev/build-api, property: token}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-push
  namespace: build-dev
spec:
  refreshInterval: 1h
  secretStoreRef: {name: vault, kind: SecretStore}
  target:
    name: registry-push
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ .config }}'
  data:
    - secretKey: config
      remoteRef: {key: delivery/dev/registry-push, property: dockerconfigjson}
