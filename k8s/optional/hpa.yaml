# Illustrative CPU HPA for DEV; review draining and capacity before enabling.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: build-service
  namespace: build-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: build-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
